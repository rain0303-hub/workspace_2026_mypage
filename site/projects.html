<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title data-i18n="meta.projects_title">Projects</title>
        <link rel="stylesheet" href="./common/css/base.css">
        <link rel="stylesheet" href="./common/css/header.css">
        <link rel="stylesheet" href="./common/css/navi.css">
        <link rel="stylesheet" href="./common/css/footer.css">
        <link rel="stylesheet" href="./common/css/components/tab.css">
        <link rel="stylesheet" href="./common/css/projects.css">
        <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&display=swap" rel="stylesheet">
        <script src="./common/js/main.js" defer></script>
        <script src="./common/js/index.js" defer></script>
        <script src="./common/js/tab.js" defer></script>
    </head>

    <body data-page="projects">
        <header class="l-header">
            <a class="header-logo" href="#" aria-label="Back to page top" data-i18n-aria-label="common.back_to_top">
                <img src="./common/images/id.svg" alt="header-logo">
            </a>

            <nav class="l-navi" id="site-navigation">
                <div class="navi-btn-container">
                    <a class="navi-btn" href="../index.html#about" data-i18n="nav.about">ABOUT</a>
                    <a class="navi-btn" href="../index.html#skill" data-i18n="nav.skill">STACK</a>
                    <a class="navi-btn" href="../index.html#works" data-i18n="nav.works">WORKS</a>
                    <a class="navi-btn" href="../index.html#contact" data-i18n="nav.contact">CONTACT</a>
                </div>
            </nav>

            <div class="header-tools">
                <div class="header-language">
                    <div class="language-menu">
                        <button
                            class="navi-btn language-menu__toggle"
                            type="button"
                            aria-expanded="false"
                            aria-controls="language-dropdown"
                        >
                            <img class="language-menu__icon" src="./common/images/language.svg" alt="">
                            <span class="language-menu__label" data-i18n="common.language">LANGUAGE</span>
                        </button>
                        <div class="language-menu__dropdown" id="language-dropdown">
                            <button class="language-menu__option" type="button" data-language="zh">中文</button>
                            <button class="language-menu__option" type="button" data-language="jp">日本語</button>
                            <button class="language-menu__option" type="button" data-language="en">English</button>
                        </div>
                    </div>
                </div>

                <button
                    class="navi-toggle"
                    type="button"
                    aria-expanded="false"
                    aria-controls="site-navigation"
                    aria-label="Open navigation"
                    data-i18n-aria-label="common.open_navigation"
                >
                    <span class="navi-toggle__line"></span>
                    <span class="navi-toggle__line"></span>
                    <span class="navi-toggle__line"></span>
                </button>
            </div>
        </header>

        <main>
            <div class="main-shell">
                <section class="projects-tabs" aria-label="Projects tabs" data-i18n-aria-label="projects.tabs_label">
                    <div class="projects-tabs__nav" role="tablist" aria-label="Project categories" data-i18n-aria-label="projects.categories_label">
                        <button class="projects-tabs__tab is-active" type="button" role="tab" aria-selected="true" data-tab="project01">
                            <span class="projects-tabs__tab-primary">#1</span>
                            <span class="projects-tabs__tab-secondary" data-i18n="projects.tabs.project01">案件01</span>
                        </button>
                        <button class="projects-tabs__tab" type="button" role="tab" aria-selected="false" data-tab="project02">
                            <span class="projects-tabs__tab-primary">#2</span>
                            <span class="projects-tabs__tab-secondary" data-i18n="projects.tabs.project02">案件02</span>
                        </button>
                        <button class="projects-tabs__tab" type="button" role="tab" aria-selected="false" data-tab="project03">
                            <span class="projects-tabs__tab-primary">#3</span>
                            <span class="projects-tabs__tab-secondary" data-i18n="projects.tabs.project03">案件03</span>
                        </button>
                        <button class="projects-tabs__tab" type="button" role="tab" aria-selected="false" data-tab="project04">
                            <span class="projects-tabs__tab-primary">#4</span>
                            <span class="projects-tabs__tab-secondary" data-i18n="projects.tabs.project04">案件04</span>
                        </button>
                        <button class="projects-tabs__tab" type="button" role="tab" aria-selected="false" data-tab="project05">
                            <span class="projects-tabs__tab-primary">#5</span>
                            <span class="projects-tabs__tab-secondary" data-i18n="projects.tabs.project05">案件05</span>
                        </button>
                        <button class="projects-tabs__tab projects-tabs__tab--overflow" type="button" role="tab" aria-selected="false" data-tab="project06">
                            <span class="projects-tabs__tab-primary">#6</span>
                            <span class="projects-tabs__tab-secondary" data-i18n="projects.tabs.project06">案件06</span>
                        </button>
                        <button class="projects-tabs__tab projects-tabs__tab--overview" type="button" role="tab" aria-selected="false" data-tab="overview">
                            <span class="projects-tabs__tab-primary projects-tabs__tab-primary--icon">
                                <img
                                    class="projects-tabs__tab-icon"
                                    src="./common/images/folder.svg"
                                    alt=""
                                    data-tab-icon-closed="./common/images/folder.svg"
                                    data-tab-icon-open="./common/images/folder-open.svg"
                                >
                            </span>
                            <span class="projects-tabs__tab-secondary" data-i18n="projects.tabs.overview">案件一览</span>
                        </button>
                    </div>

                    <div class="projects-tabs__panel" role="tabpanel">
                        <div class="projects-tabs__panel-default">
                            <div class="projects-tabs__panel-column">
                                <div class="projects-tabs__panel-group">
                                    <h3 data-i18n="projects.panel.left.project_name_label">Project:</h3>
                                    <p data-project-field="left.project_name"></p>
                                </div>
                                <div class="projects-tabs__panel-group">
                                    <h3 data-i18n="projects.panel.left.period_label">Period:</h3>
                                    <p data-project-field="left.period"></p>
                                </div>
                                <div class="projects-tabs__panel-group">
                                    <h3 data-i18n="projects.panel.left.position_label">Position:</h3>
                                    <p data-project-field="left.position"></p>
                                </div>
                                <div class="projects-tabs__panel-group">
                                    <h3 data-i18n="projects.panel.left.overview_label">Overview:</h3>
                                    <p data-project-field="left.overview"></p>
                                </div>
                            </div>
                            <div class="projects-tabs__panel-column">
                                <div class="projects-tabs__panel-group">
                                    <h3 data-i18n="projects.panel.center.content_label">Content:</h3>
                                    <div data-project-field="center.content" data-project-field-type="rich"></div>
                                </div>
                            </div>
                            <div class="projects-tabs__panel-column">
                                <div class="projects-tabs__panel-group">
                                    <h3 data-i18n="projects.panel.right.os_label">OS:</h3>
                                    <p data-project-field="right.os"></p>
                                </div>
                                <div class="projects-tabs__panel-group">
                                    <h3 data-i18n="projects.panel.right.language_label">Language:</h3>
                                    <p data-project-field="right.language"></p>
                                </div>
                                <div class="projects-tabs__panel-group">
                                    <h3 data-i18n="projects.panel.right.framework_label">Framework:</h3>
                                    <p data-project-field="right.framework"></p>
                                </div>
                                <div class="projects-tabs__panel-group">
                                    <h3 data-i18n="projects.panel.right.ide_label">IDE:</h3>
                                    <p data-project-field="right.ide"></p>
                                </div>
                                <div class="projects-tabs__panel-group">
                                    <h3 data-i18n="projects.panel.right.db_label">DB:</h3>
                                    <p data-project-field="right.db"></p>
                                </div>
                                <div class="projects-tabs__panel-group">
                                    <h3 data-i18n="projects.panel.right.cloud_label">Cloud:</h3>
                                    <p data-project-field="right.cloud"></p>
                                </div>
                                <div class="projects-tabs__panel-group">
                                    <h3 data-i18n="projects.panel.right.tools_label">Tools:</h3>
                                    <p data-project-field="right.tools"></p>
                                </div>
                            </div>
                        </div>

                        <div class="projects-tabs__panel-overview" data-overview-panel hidden>
                            <ul class="projects-tabs__overview-list">
                                <li class="projects-tabs__overview-item">
                                    <button class="projects-tabs__overview-button" type="button" data-overview-target="project01">
                                        <span class="projects-tabs__overview-bullet">#01</span>
                                        <span data-i18n="projects.tabs.project01">案件01</span>
                                    </button>
                                </li>
                                <li class="projects-tabs__overview-item">
                                    <button class="projects-tabs__overview-button" type="button" data-overview-target="project02">
                                        <span class="projects-tabs__overview-bullet">#02</span>
                                        <span data-i18n="projects.tabs.project02">案件02</span>
                                    </button>
                                </li>
                                <li class="projects-tabs__overview-item">
                                    <button class="projects-tabs__overview-button" type="button" data-overview-target="project03">
                                        <span class="projects-tabs__overview-bullet">#03</span>
                                        <span data-i18n="projects.tabs.project03">案件03</span>
                                    </button>
                                </li>
                                <li class="projects-tabs__overview-item">
                                    <button class="projects-tabs__overview-button" type="button" data-overview-target="project04">
                                        <span class="projects-tabs__overview-bullet">#04</span>
                                        <span data-i18n="projects.tabs.project04">案件04</span>
                                    </button>
                                </li>
                                <li class="projects-tabs__overview-item">
                                    <button class="projects-tabs__overview-button" type="button" data-overview-target="project05">
                                        <span class="projects-tabs__overview-bullet">#05</span>
                                        <span data-i18n="projects.tabs.project05">案件05</span>
                                    </button>
                                </li>
                                <li class="projects-tabs__overview-item">
                                    <button class="projects-tabs__overview-button" type="button" data-overview-target="project06">
                                        <span class="projects-tabs__overview-bullet">#06</span>
                                        <span data-i18n="projects.tabs.project06">案件06</span>
                                    </button>
                                </li>
                                <li class="projects-tabs__overview-item">
                                    <button class="projects-tabs__overview-button" type="button" data-overview-target="project07">
                                        <span class="projects-tabs__overview-bullet">#07</span>
                                        <span data-i18n="projects.tabs.project07">案件07</span>
                                    </button>
                                </li>
                                <li class="projects-tabs__overview-item">
                                    <button class="projects-tabs__overview-button" type="button" data-overview-target="project08">
                                        <span class="projects-tabs__overview-bullet">#08</span>
                                        <span data-i18n="projects.tabs.project08">案件08</span>
                                    </button>
                                </li>
                            </ul>
                        </div>
                    </div>
                </section>
            </div>
        </main>

        <footer class="l-footer">
            <div class="l-footer__inner">
                <p class="l-footer__brand">HONG XL</p>
                <nav class="l-footer__nav" aria-label="Footer" data-i18n-aria-label="common.footer">
                    <a class="l-footer__link" href="../index.html#about" data-i18n="nav.about">ABOUT</a>
                    <a class="l-footer__link" href="../index.html#skill" data-i18n="nav.skill">STACK</a>
                    <a class="l-footer__link" href="../index.html#works" data-i18n="nav.works">WORKS</a>
                    <a class="l-footer__link" href="../index.html#contact" data-i18n="nav.contact">CONTACT</a>
                </nav>
                <p class="l-footer__copy">© 2026 HONG XL</p>
            </div>
        </footer>
    </body>
</html>
