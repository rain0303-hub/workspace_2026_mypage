<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Projects</title>
        <link rel="stylesheet" href="./common/css/index.css">
        <link rel="stylesheet" href="./common/css/header.css">
        <link rel="stylesheet" href="./common/css/navi.css">
        <link rel="stylesheet" href="./common/css/footer.css">
        <link rel="stylesheet" href="./common/css/projects.css">
        <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&display=swap" rel="stylesheet">
        <script src="./common/js/index.js" defer></script>
        <script src="./common/js/projects.js" defer></script>
    </head>

    <body>
        <header class="l-header">
            <a class="header-logo" href="./index.html" aria-label="Back to top">
                <img src="./common/images/id.svg" alt="header-logo">
            </a>

            <nav class="l-navi" id="site-navigation">
                <div class="navi-btn-container">
                    <a class="navi-btn" href="./index.html#about">ABOUT</a>
                    <a class="navi-btn" href="./index.html#skill">SKILL</a>
                    <a class="navi-btn" href="./index.html#works">WORKS</a>
                    <a class="navi-btn" href="./index.html#contact">CONTACT</a>
                </div>
            </nav>

            <div class="header-tools">
                <div class="header-language">
                    <div class="language-menu">
                        <button class="navi-btn language-menu__toggle" type="button" aria-expanded="false" aria-controls="language-dropdown">
                            <img class="language-menu__icon" src="./common/images/language.svg" alt="">
                            LANGUAGE
                        </button>
                        <div class="language-menu__dropdown" id="language-dropdown">
                            <button class="language-menu__option" type="button">Chinese</button>
                            <button class="language-menu__option" type="button">Japanese</button>
                            <button class="language-menu__option" type="button">English</button>
                        </div>
                    </div>
                </div>

                <button class="navi-toggle" type="button" aria-expanded="false" aria-controls="site-navigation" aria-label="Open navigation">
                    <span class="navi-toggle__line"></span>
                    <span class="navi-toggle__line"></span>
                    <span class="navi-toggle__line"></span>
                </button>
            </div>
        </header>

        <main>
            <div class="main-shell">
                <section class="projects-tabs" aria-label="Projects tabs">
                    <div class="projects-tabs__nav" role="tablist" aria-label="Project categories">
                        <button class="projects-tabs__tab is-active" type="button" role="tab" aria-selected="true" data-tab="web">
                            <span class="projects-tabs__tab-primary">#1</span>
                            <span class="projects-tabs__tab-secondary">P1</span>
                        </button>
                        <button class="projects-tabs__tab" type="button" role="tab" aria-selected="false" data-tab="app">
                            <span class="projects-tabs__tab-primary">#2</span>
                            <span class="projects-tabs__tab-secondary">P2</span>
                        </button>
                        <button class="projects-tabs__tab" type="button" role="tab" aria-selected="false" data-tab="other">
                            <span class="projects-tabs__tab-primary">#3</span>
                            <span class="projects-tabs__tab-secondary">P3</span>
                        </button>
                    </div>

                    <div class="projects-tabs__panel" role="tabpanel" aria-label="Citizen projects">
                        <div class="projects-tabs__panel-visual" aria-hidden="true">
                            <h3>No...</h3>
                        </div>

                        <div class="projects-tabs__panel-copy">
                            <p class="projects-tabs__eyebrow" data-tab-eyebrow>Citizen</p>
                            <h1 class="projects-tabs__title" data-tab-title>Convenient Navigation</h1>
                            <p class="projects-tabs__text" data-tab-text>
                                A simple preview area for each tab. We can place cards, screenshots, and project details here next.
                            </p>
                        </div>
                    </div>
                </section>
            </div>
        </main>

        <footer class="l-footer">
            <div class="l-footer__inner">
                <p class="l-footer__brand">HONG XL</p>
                <nav class="l-footer__nav" aria-label="Footer">
                    <a class="l-footer__link" href="./index.html#about">ABOUT</a>
                    <a class="l-footer__link" href="./index.html#skill">SKILL</a>
                    <a class="l-footer__link" href="./index.html#works">WORKS</a>
                    <a class="l-footer__link" href="./index.html#contact">CONTACT</a>
                </nav>
                <p class="l-footer__copy">2026 HONG XL</p>
            </div>
        </footer>
    </body>
</html>
