<!DOCTYPE html>
<html lang="jp">
    <head>
        <meta charset="UTF-8">
        <title>hero</title>
        <link rel="stylesheet" href="./common/css/header.css">
        <link rel="stylesheet" href="./common/css/navi.css">
        <link rel="stylesheet" href="./common/css/footer.css"> 
        <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&display=swap" rel="stylesheet">

    </head>

    <body>
        <!-- header -->
        <header class="l-header">
            <div class="header-logo">
                <img src="./common/images/01.png" alt="header-logo">
            </div>

            <!-- navi -->
            <nav class="l-navi">
                <div class="navi-btn-container">
                    <a class="navi-btn" href="#">HERO</a>
                    <a class="navi-btn" href="#">ABOUT</a>
                    <a class="navi-btn" href="#">WORKS</a>
                    <a class="navi-btn" href="#">CONTACT</a>
                </div>
            </nav>
        </header>

        <!-- main -->
        <main>
            <!-- main-slider -->
            <div class="main-slider-container">
                <div class="main-slider-up-area">
                    <!-- div-left -->
                    <div class="slider-btn slider-btn-prev">
                        <button type="button">prev</button>
                    </div>

                    <!-- div-center -->
                    <div class="main-slider-center-area">
                        <div class="slider-text">
                            <h2>Hello myself !<br>Hello 2026 !</h2>
                            <p>what the dog doing</p>
                        </div>

                        <div class="slider-image">
                        <img src="common/images/slider.png" alt="slider.png">
                        </div>
                    </div>

                    <!-- div-right -->
                    <div class="slider-btn slider-btn-next">
                        <button type="button">next</button>
                    </div>
                </div>

                <div class="main-slider-down-area">
                    <p>down</p>
                </div>
            </div>
        </main>

        <!-- footer -->
        <footer class="l-footer">
            <p>footer here</p>
        </footer>
    </body>

</html>
