<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title data-i18n="meta.home_title"></title>
        <link rel="stylesheet" href="./site/assets/css/base.css">
        <link rel="stylesheet" href="./site/assets/css/pages/index.css">
        <link rel="stylesheet" href="./site/assets/css/layout/header.css">
        <link rel="stylesheet" href="./site/assets/css/layout/navi.css">
        <link rel="stylesheet" href="./site/assets/css/layout/footer.css">
        <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&display=swap" rel="stylesheet">
        <script src="./site/assets/js/main.js" defer></script>
        <script src="./site/assets/js/index.js" defer></script>
    </head>

    <body data-page="home">
        <header class="l-header">
            <a class="header-logo" href="./index.html" data-i18n-aria-label="common.back_to_top">
                <img src="./site/assets/images/id.svg" alt="header-logo">
            </a>

            <nav class="l-navi" id="site-navigation">
                <div class="navi-btn-container">
                    <a class="navi-btn" href="#about" data-i18n="nav.about"></a>
                    <a class="navi-btn" href="#skill" data-i18n="nav.skill"></a>
                    <a class="navi-btn" href="#works" data-i18n="nav.works"></a>
                    <a class="navi-btn" href="#contact" data-i18n="nav.contact"></a>
                </div>
            </nav>

            <div class="header-tools">
                <div class="header-language">
                    <div class="language-menu">
                        <button
                            class="navi-btn language-menu__toggle"
                            type="button"
                            aria-expanded="false"
                            aria-controls="language-dropdown"
                        >
                            <img class="language-menu__icon" src="./site/assets/images/language.svg" alt="">
                            <span class="language-menu__label" data-i18n="common.language"></span>
                        </button>
                        <div class="language-menu__dropdown" id="language-dropdown">
                            <button class="language-menu__option" type="button" data-language="zh">中文</button>
                            <button class="language-menu__option" type="button" data-language="jp">日本語</button>
                            <button class="language-menu__option" type="button" data-language="en">English</button>
                        </div>
                    </div>
                </div>

                <button
                    class="navi-toggle"
                    type="button"
                    aria-expanded="false"
                    aria-controls="site-navigation"
                    data-i18n-aria-label="common.open_navigation"
                >
                    <span class="navi-toggle__line"></span>
                    <span class="navi-toggle__line"></span>
                    <span class="navi-toggle__line"></span>
                </button>
            </div>
        </header>

        <main>
            <div class="main-img">
                <picture>
                    <source media="(max-width: 575px)" data-content-srcset="home.main_image.mobile">
                    <img data-content-src="home.main_image.desktop" alt="">
                </picture>
            </div>

            <div class="main-shell">
                <section class="sub-area-01" id="about">
                    <div class="sub-area-01__img">
                        <img data-content-src="home.about.image" alt="about visual">
                    </div>

                    <div class="sub-area-01__text-box">
                        <h2 class="sub-area-01__title" data-i18n="home.about.title"></h2>
                        <p class="sub-area-01__text indent" data-i18n="home.about.body_1"></p>
                        <p class="sub-area-01__text indent" data-i18n="home.about.body_2"></p>
                    </div>
                </section>

                <section class="sub-area-02" id="skill">
                    <div class="sub-area-02__text-box">
                        <h2 class="sub-area-02__title" data-i18n="home.skill.title"></h2>
                        <ul class="skill-list">
                            <li class="skill-list__item">
                                <span class="skill-list__label" data-i18n="home.skill.frontend_label"></span>
                                <span class="skill-list__value">HTML / CSS / JavaScript / React / Vue</span>
                            </li>
                            <li class="skill-list__item">
                                <span class="skill-list__label" data-i18n="home.skill.backend_label"></span>
                                <span class="skill-list__value">Java / Servlet / MyBatis / Spring / SpringBoot / SpringBatch</span>
                            </li>
                            <li class="skill-list__item">
                                <span class="skill-list__label" data-i18n="home.skill.cloud_label"></span>
                                <span class="skill-list__value">AWS</span>
                            </li>
                            <li class="skill-list__item">
                                <span class="skill-list__label" data-i18n="home.skill.other_label"></span>
                                <span class="skill-list__value">Shell / VBA / AI Agent</span>
                            </li>
                        </ul>
                    </div>

                    <div class="sub-area-02__img">
                        <img data-content-src="home.skill.image" alt="skill visual">
                    </div>
                </section>

                <section class="sub-area-01" id="works">
                    <div class="sub-area-01__img">
                        <img data-content-src="home.works.image" alt="project visual">
                    </div>

                    <div class="sub-area-01__text-box">
                        <h2 class="sub-area-01__title" data-i18n="home.works.title"></h2>
                        <p class="sub-area-01__text indent" data-i18n="home.works.body"></p>
                        <a class="project-link" href="./projects.html">
                            <span class="project-link__label" data-i18n="home.works.link"></span>
                            <span class="project-link__circle" aria-hidden="true">
                                <img class="project-link__arrow" src="./site/assets/images/arrow-next.svg" alt="">
                            </span>
                        </a>
                    </div>
                </section>

                <section class="sub-area-02" id="contact">
                    <div class="sub-area-02__text-box">
                        <h2 class="sub-area-02__title" data-i18n="home.contact.title"></h2>
                        <p class="sub-area-02__text" data-i18n="home.contact.body_1"></p>
                        <p class="sub-area-02__text" data-i18n="home.contact.body_2"></p>
                        <p class="sub-area-02__text contact-copy-row">
                            <span class="contact-copy-label">Email:</span>
                            <span class="contact-copy-value">...@icloud.com</span>
                            <button class="contact-copy-btn" type="button" data-i18n-aria-label="home.contact.copy_email">
                                <img class="contact-copy-icon" src="./site/assets/images/copy.svg" alt="">
                            </button>
                        </p>
                        <p class="sub-area-02__text contact-copy-row">
                            <span class="contact-copy-label">GitHub:</span>
                            <span class="contact-copy-value">https://github.com/...</span>
                            <button class="contact-copy-btn" type="button" data-i18n-aria-label="home.contact.copy_github">
                                <img class="contact-copy-icon" src="./site/assets/images/copy.svg" alt="">
                            </button>
                        </p>
                    </div>

                    <div class="sub-area-02__img">
                        <img data-content-src="home.contact.image" alt="contact visual">
                    </div>
                </section>
            </div>
        </main>

        <footer class="l-footer">
            <div class="l-footer__inner">
                <p class="l-footer__brand">HONG XL</p>
                <nav class="l-footer__nav" data-i18n-aria-label="common.footer">
                    <a class="l-footer__link" href="#about" data-i18n="nav.about"></a>
                    <a class="l-footer__link" href="#skill" data-i18n="nav.skill"></a>
                    <a class="l-footer__link" href="#works" data-i18n="nav.works"></a>
                    <a class="l-footer__link" href="#contact" data-i18n="nav.contact"></a>
                </nav>
                <p class="l-footer__copy">© 2026 HONG XL</p>
            </div>
        </footer>

        <button class="scroll-top-btn" type="button" data-i18n-aria-label="common.back_to_top">
            <img class="scroll-top-btn__icon" src="./site/assets/images/scroll_top.svg" alt="">
        </button>
    </body>
</html>
